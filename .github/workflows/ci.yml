name: DataConverter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y cmake g++ make

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install cmake

    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
      
    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-
          
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Test (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: build
      run: ctest --output-on-failure -C Release > ctest_log_${{ matrix.os }}.txt
      
    - name: Test
      working-directory: build
      shell: bash
      run: ctest --output-on-failure -C Release | tee ctest_log_${{ matrix.os }}.txt

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: ctest_log_${{ matrix.os }}.txt
